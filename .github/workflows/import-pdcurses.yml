name: Import pinned PDCurses source

on:
  push:
    branches:
      - import/pdcurses
    paths:
      - .github/workflows/import-pdcurses.yml

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import complete pinned PDCurses tree
        shell: bash
        env:
          UPSTREAM_URL: https://github.com/wmcbrine/PDCurses.git
          UPSTREAM_COMMIT: 2b6a9e920dc14523829b0b9495f2e3281f03cf29
        run: |
          set -euo pipefail

          if test -e pdcurses; then
            echo 'pdcurses/ already exists; refusing to overwrite it' >&2
            exit 1
          fi

          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT

          git -C "$temporary" init --quiet
          git -C "$temporary" remote add upstream "$UPSTREAM_URL"
          git -C "$temporary" fetch --quiet --depth=1 upstream "$UPSTREAM_COMMIT"

          actual_commit="$(git -C "$temporary" rev-parse FETCH_HEAD)"
          test "$actual_commit" = "$UPSTREAM_COMMIT"

          mkdir pdcurses
          git -C "$temporary" archive "$UPSTREAM_COMMIT" | tar -x -C pdcurses

          upstream_tree="$(git -C "$temporary" rev-parse "$UPSTREAM_COMMIT^{tree}")"
          upstream_files="$(git -C "$temporary" ls-tree -r --name-only "$UPSTREAM_COMMIT" | wc -l | tr -d ' ')"

          git -C "$temporary" ls-tree -r -l "$UPSTREAM_COMMIT" > pdcurses/SOURCE_MANIFEST.txt
          cat > pdcurses/UPSTREAM.md <<EOF
          # PDCurses upstream source snapshot

          This directory contains the complete tracked source tree from PDCurses,
          copied without pruning for source study inside icurses.

          - Upstream: https://github.com/wmcbrine/PDCurses
          - Exact commit: \`$UPSTREAM_COMMIT\`
          - Upstream Git tree: \`$upstream_tree\`
          - Upstream tracked files: $upstream_files

          The upstream source, documentation, demos, build files, and platform
          backends are all retained. Nothing here is a claim that icurses builds,
          supports, or has accepted PDCurses on any platform yet.

          PDCurses describes the core package and most ports as public domain, with
          some files in the demos and X11 directories carrying their own copyright
          licenses. The imported upstream notices remain authoritative for reuse.

          \`SOURCE_MANIFEST.txt\` records each upstream path, mode, blob ID, and size.
          It and this file are local provenance metadata; all other files under this
          directory come from the pinned upstream tree.
          EOF

          git config user.name 'icurses source importer'
          git config user.email 'isomorphisms@users.noreply.github.com'
          git add pdcurses
          git commit -m "Import complete pinned PDCurses source"
          git push origin HEAD:import/pdcurses
